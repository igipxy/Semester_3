<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMPUS-Mini | Member List | Jobsheet 6</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header>
        <h1>SIMPUS-Mini</h1>
        <button type="button" id="nav-toggle-btn" class="nav-toggle-label" aria-label="Open or close navigation menu" aria-expanded="false" aria-controls="main-nav">&#9776;</button>
        <nav id="main-nav" aria-label="Main navigation">
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="../buku/list.html">Book List</a></li>
                <li><a href="../buku/tambah.html">Add Book</a></li>
                <li><a href="list.html">Member List</a></li>
                <li><a href="tambah.html">Add Member</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Member List</h2>
            <div class="search-box">
                <label for="search-input">Search members</label>
                <input type="text" id="search-input" placeholder="Type a member number, name, or address...">
            </div>
            <p id="loading-indicator" style="display: none;">Loading data...</p>
            <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Member No.</th>
                        <th>Name</th>
                        <th>Address</th>
                        <th>Mobile No.</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Rows are populated by assets/js/anggota.js from data/anggota.json. -->
                </tbody>
            </table>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 SIMPUS-Mini - Jobsheet 6</p>
    </footer>
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/anggota.js"></script>
</body>
</html>
