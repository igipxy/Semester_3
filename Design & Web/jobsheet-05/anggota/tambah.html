    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header>
        <h1>SIMPUS-Mini</h1>
        <button type="button" id="nav-toggle-btn" class="nav-toggle-label" aria-label="Open or close navigation menu" aria-expanded="false" aria-controls="main-nav">&#9776;</button>
        <nav id="main-nav" aria-label="Main navigation">
            <ul>
                <li><a href="../index.html">Home</a></li>

                <li><a href="tambah.html">Add Member</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Add Member</h2>
            <form id="form-tambah" novalidate>
                <p>
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required>
                </p>
                <p>
                    <label for="member_number">Member No.</label>
                    <input type="text" id="member_number" name="member_number" required>
                </p>
                <p>
                    <label for="address">Address</label>
                    <input type="text" id="address" name="address">
                </p>
                <p>
                    <label for="mobile_number">Mobile No.</label>
                    <input type="text" id="mobile_number" name="mobile_number">
                </p>
                <p>
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email">
                </p>
                <p>
                    <button type="submit">Save</button>
                </p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 SIMPUS-Mini - Jobsheet 5</p>
    </footer>
